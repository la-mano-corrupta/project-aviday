<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>2D Philosophy Short — Canvas Renderer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0c0d10; display: grid; place-items: center; overflow: hidden; }
    canvas#cv {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: block;
      background: #F4EFE6;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
