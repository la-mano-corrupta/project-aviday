name = "insta-personal-agent"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Override in .dev.vars locally or via `npx wrangler secret put META_VERIFY_TOKEN`
META_VERIFY_TOKEN = "CHANGE_ME_VERIFY_TOKEN"

# Once you create your free Cloudflare D1 Database (`npx wrangler d1 create insta-agent-db`),
# uncomment the block below and paste your database_id:
# [[d1_databases]]
# binding = "DB"
# database_name = "insta-agent-db"
# database_id = "YOUR_D1_DATABASE_ID"

# Optional built-in Cloudflare Workers AI fallback:
# [ai]
# binding = "AI"
